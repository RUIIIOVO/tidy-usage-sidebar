<!doctype html><meta charset="utf-8"><title>pin alternatives</title>
<style>
:root{--sans:-apple-system,"SF Pro Text","PingFang SC",system-ui;--serif:"New York","Iowan Old Style",Georgia,serif;--or:#f0932b;--rd:#e5484d;--acc:#0a84ff}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:#0e0e10;color:#ccc;padding:40px 40px;-webkit-font-smoothing:antialiased}
.grid{display:grid;grid-template-columns:repeat(4,300px);gap:28px;justify-content:center}
.card{background:radial-gradient(120% 80% at 15% 0%,#3a3550,#1b1a26 55%,#111018);border-radius:14px;padding:14px}
.pop{border-radius:12px;padding:4px 12px 8px;background:rgba(38,37,46,.8);color:#f4f3f6;box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.45);--mut:rgba(244,243,246,.5);--track:rgba(255,255,255,.11);--hair:rgba(255,255,255,.09);--fill:#f4f3f6;--hov:rgba(255,255,255,.06)}
.sh{display:flex;align-items:center;gap:7px;padding:10px 6px 4px}.sh b{font:600 13px var(--sans)}
.sh .e{margin-left:auto;font:500 11px var(--sans);color:var(--acc)}
.row{padding:7px 6px 8px;border-radius:7px;display:flex;gap:9px;align-items:center}
.row.hov{background:var(--hov)}
.main{flex:1;min-width:0}
.l1{display:flex;align-items:baseline;gap:7px}
.l1 .n{font:500 12.5px var(--sans)}.l1 .r{font:400 10.5px var(--sans);color:var(--mut)}
.l1 .p{margin-left:auto;font:400 17px var(--serif)}.l1 .p small{font-size:11px;color:var(--mut)}
.bar{height:4px;border-radius:2px;background:var(--track);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--fill)}
.foot{display:flex;justify-content:space-between;padding:8px 6px 0;margin-top:4px;border-top:.5px solid var(--hair);font:400 11px var(--sans);color:var(--mut)}
h3{font:600 14px var(--sans);color:#fff;margin:14px 2px 4px}
p{font:400 12px/1.65 var(--sans);color:#8b8b95;margin:0 2px}
p b{color:#ddd;font-weight:500}
.tag{display:inline-block;font:500 10px var(--sans);letter-spacing:.08em;color:#7fbf9a;border:1px solid #3c5a48;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
/* switch */
.sw{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.18);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:#30d158}.sw.on::after{left:12.5px}
</style>
<body><div class="grid" id="g"></div>
