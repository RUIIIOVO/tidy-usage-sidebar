<!doctype html><meta charset="utf-8"><title>logo + rings</title>
<style>
body{margin:0;padding:40px 48px;max-width:1400px;background:#0e0e10;color:#ccc;font:13px -apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
h1{font:600 15px -apple-system;color:#fff;margin:0 0 4px}
.sub{color:#888;font-size:12px;margin-bottom:22px;line-height:1.6}
.block{margin-bottom:46px}
.row{display:flex;gap:26px;align-items:center;margin-bottom:12px}
.lab{width:120px;color:#777;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.mb{height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;gap:14px;font:500 13px -apple-system}
.mb.d{background:linear-gradient(90deg,#2a2735,#1f1d29);color:#f2f2f5}
.mb.l{background:linear-gradient(90deg,#efe6da,#dcd8e8);color:#1c1c1e}
.grp{display:inline-flex;align-items:center;gap:4px}
.clock{opacity:.9}
.zoom{zoom:3;margin:6px 0}
.cmp{display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start}
.note{color:#8b8b95;font-size:12px;line-height:1.7;margin-top:8px}
.note b{color:#ddd;font-weight:500}
</style>

 <div class="note">${note}</div></div>`}

 block('B','方案 B：Logo ＋ 两个带标签的环（5 / W）','即方案 2：环中间放 5（5 小时）和 W（周）。','<b>不用记规则。</b>代价是环里的字很小（约 7pt），在 1× 的外接屏上可能发糊。')+
